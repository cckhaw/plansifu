name: Daily Scraper

on:
  schedule:
    - cron: "23 18 * * *" # ~02:23 MYT/SGT (18:23 UTC the previous day): telco crawl, every day. Off the top of the hour because GitHub delays or skips :00 schedules when it is busy
    - cron: "37 19 * * 6" # ~03:37 MYT/SGT Sunday (19:37 UTC Saturday): Travel eSIM crawl, once a week
  workflow_dispatch:
    inputs:
      telco_providers:
        description: >-
          Telco providers to crawl: all, none, Malaysia, Singapore, or comma-separated names.
          MY: Ansar, CelcomDigi, CMLink (MY), Eastel, HelloSIM, Hotlink, Maxis, Spark, TuneTalk, U Mobile, Unifi, Vibe, XOX, Yes, redONE.
          SG: CMLink (SG), Cuniq, Eight, Giga, Gomo, M1, Maxx, SIMBA, Singtel, Singtel hi!, StarHub, Vivifi, Zero1, Zym.
        required: false
        default: "all"
      esim_providers:
        description: >-
          Travel eSIM brands to crawl: none (default), all, or comma-separated names.
          Airalo, Holafly, Saily, Nomad, Jetpac, Eskimo, Roamless, MobiMatter, Yesim, SimLocal, Firsty, easySim, Flexiroam, Maya, BNESIM, GigSky, aloSIM, Ubigi, Instabridge, GogoRoaming.
        required: false
        default: "none"

concurrency:
  group: daily-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      # Scheduled runs: the nightly cron crawls every telco and no eSIM; the Sunday cron crawls only eSIM.
      # Manual runs use the two inputs above (an empty field means the default).
      - name: Decide what to run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          IN_TELCO: ${{ inputs.telco_providers }}
          IN_ESIM: ${{ inputs.esim_providers }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            telco="${IN_TELCO:-all}"
            esim="${IN_ESIM:-none}"
          elif [ "$SCHEDULE" = "37 19 * * 6" ]; then
            telco="none"
            esim="all"
          else
            telco="all"
            esim="none"
          fi
          norm() { echo "$1" | tr '[:upper:]' '[:lower:]' | tr -d ' '; }
          echo "telco=$telco" >> "$GITHUB_OUTPUT"
          echo "esim=$esim" >> "$GITHUB_OUTPUT"
          echo "run_telco=$([ "$(norm "$telco")" = none ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          echo "run_esim=$([ "$(norm "$esim")" = none ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          # Targeted manual runs (a country or specific names) log the raw model output for debugging.
          is_targeted() { case "$(norm "$1")" in all|none) return 1 ;; *) return 0 ;; esac; }
          if is_targeted "$telco" || is_targeted "$esim"; then debug=1; else debug=""; fi
          echo "debug=$debug" >> "$GITHUB_OUTPUT"
          echo "Telco providers: $telco | Travel eSIM brands: $esim"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run telco scrapers
        if: ${{ steps.plan.outputs.run_telco == 'true' }}
        run: npm run scrape
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCRAPE_ONLY: ${{ steps.plan.outputs.telco }}
          SCRAPE_DEBUG: ${{ steps.plan.outputs.debug }}

      # A failure here must not block the deploy hook.
      - name: Run Travel eSIM scrapers
        if: ${{ !cancelled() && steps.plan.outputs.run_esim == 'true' }}
        continue-on-error: true
        run: npm run scrape:esim
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCRAPE_ONLY: ${{ steps.plan.outputs.esim }}
          SCRAPE_DEBUG: ${{ steps.plan.outputs.debug }}

      - name: Trigger Vercel deploy
        if: success()
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL not set; skipping"
          else
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
          fi
