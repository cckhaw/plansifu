name: Daily Scraper

on:
  schedule:
    - cron: "23 18 * * *" # ~02:23 MYT/SGT (18:23 UTC the previous day): telco crawl, every day. Off the top of the hour because GitHub delays or skips :00 schedules when it is busy
    - cron: "37 19 * * 6" # ~03:37 MYT/SGT Sunday (19:37 UTC Saturday): Travel eSIM crawl, once a week
  workflow_dispatch:
    inputs:
      providers:
        description: "Optional comma-separated provider names to scrape (default: all)"
        required: false
        default: ""
      suite:
        description: "What to run: all (default), telco, esim (Travel eSIM crawl) or audit (print a Travel eSIM data-quality summary)"
        required: false
        default: "all"

concurrency:
  group: daily-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run scrapers
        if: ${{ github.event.schedule == '23 18 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'telco')) }}
        run: npm run scrape
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }} # backup engine only
          SCRAPE_ONLY: ${{ inputs.providers }}
          SCRAPE_DEBUG: ${{ inputs.providers != '' && '1' || '' }}

      # Travel eSIM brands: weekly (Sunday 04:00 MYT) or on demand. A failure here must not block the deploy hook.
      - name: Run Travel eSIM scrapers
        if: ${{ !cancelled() && (github.event.schedule == '37 19 * * 6' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'esim'))) }}
        continue-on-error: true
        run: npm run scrape:esim
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCRAPE_ONLY: ${{ inputs.providers }}
          SCRAPE_DEBUG: ${{ inputs.providers != '' && '1' || '' }}

      - name: Audit Travel eSIM data
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'audit' }}
        run: npx tsx scripts/esim/audit.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUDIT_DEST: ${{ inputs.providers }}

      - name: Trigger Vercel deploy
        if: success()
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL not set; skipping"
          else
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
          fi
