name: Daily Scraper

on:
  schedule:
    - cron: "0 19 * * *" # 03:00 MYT/SGT (UTC+8) = 19:00 UTC the previous day
  workflow_dispatch:
    inputs:
      providers:
        description: "Optional comma-separated provider names to scrape (default: all)"
        required: false
        default: ""

concurrency:
  group: daily-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium (scraper fallback)
        run: npx playwright install --with-deps chromium

      - name: Run scrapers
        run: npm run scrape
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          SCRAPE_ONLY: ${{ inputs.providers }}
          SCRAPE_DEBUG: ${{ inputs.providers != '' && '1' || '' }}

      - name: Trigger Vercel deploy
        if: success()
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL not set; skipping"
          else
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
          fi
