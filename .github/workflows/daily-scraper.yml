name: Daily Scraper

on:
  schedule:
    - cron: "0 19 * * *" # 03:00 MYT/SGT (UTC+8) = 19:00 UTC the previous day: telco crawl, every day
    - cron: "0 20 * * 6" # 04:00 MYT/SGT on Sunday = 20:00 UTC Saturday: Travel eSIM crawl, once a week
  workflow_dispatch:
    inputs:
      providers:
        description: "Optional comma-separated provider names to scrape (default: all)"
        required: false
        default: ""
      suite:
        description: "What to crawl: all (default), telco, or esim (Travel eSIM brands)"
        required: false
        default: "all"

concurrency:
  group: daily-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run scrapers
        if: ${{ github.event.schedule == '0 19 * * *' || (github.event_name == 'workflow_dispatch' && inputs.suite != 'esim') }}
        run: npm run scrape
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }} # backup engine only
          SCRAPE_ONLY: ${{ inputs.providers }}
          SCRAPE_DEBUG: ${{ inputs.providers != '' && '1' || '' }}

      # Travel eSIM brands: weekly (Sunday 04:00 MYT) or on demand. A failure here must not block the deploy hook.
      - name: Run Travel eSIM scrapers
        if: ${{ !cancelled() && (github.event.schedule == '0 20 * * 6' || (github.event_name == 'workflow_dispatch' && inputs.suite != 'telco')) }}
        continue-on-error: true
        run: npm run scrape:esim
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCRAPE_ONLY: ${{ inputs.providers }}
          SCRAPE_DEBUG: ${{ inputs.providers != '' && '1' || '' }}

      - name: Trigger Vercel deploy
        if: success()
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL not set; skipping"
          else
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
          fi
